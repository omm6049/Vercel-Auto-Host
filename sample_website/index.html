<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Auto-Hosted Vercel Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="container">
    <div class="card glass-card">
      <div class="badge">🚀 Deployed via Telegram Bot & Vercel</div>
      <h1 class="title">Hello from <span class="gradient-text">Vercel Auto Host</span>!</h1>
      <p class="description">
        This website was automatically assembled from <strong>index.html</strong>, <strong>style.css</strong>, and <strong>logic.js</strong> and deployed directly to Vercel!
      </p>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-number">3</span>
          <span class="stat-label">Files Linked</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">100%</span>
          <span class="stat-label">Fast CDN</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="clickCount">0</span>
          <span class="stat-label">Live Clicks</span>
        </div>
      </div>

      <div class="action-box">
        <button id="interactiveBtn" class="btn btn-primary">
          ✨ Test Interactive JS Logic
        </button>
        <button id="themeToggleBtn" class="btn btn-secondary">
          🎨 Change Theme Color
        </button>
      </div>

      <div id="statusNotification" class="notification hidden">
        🎉 JavaScript logic is working smoothly!
      </div>
    </div>
  </main>

  <script src="logic.js"></script>
</body>
</html>
